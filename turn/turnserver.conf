# coturn configuration for the local development relay. Started by
# turn/docker-compose.yml (`npm run turn:up`) and verified by `npm run check:turn`.
#
# The credentials below are throwaway, and deliberately committed. They are not a
# secret and must not be reused anywhere: this relay only listens on the machine
# running it. A deployed demo should point VITE_TURN_* at a real relay with
# short-lived credentials instead (see the README).
#
# Every option here appears in coturn's own example config
# (examples/etc/turnserver.conf) if you want the full set.

# --- listener ----------------------------------------------------------------

listening-port=3478

# Plain TURN over UDP and TCP only. TLS is off deliberately: WebRTC will not
# trust a self-signed certificate, so a local `turns:` relay fails in the browser
# for a reason that has nothing to do with the relay path. To exercise a TLS
# relay from the command line instead, use `check:turn --insecure`.
#
# (DTLS needs no option here — coturn does not start a DTLS listener unless the
# `dtls` flag is set, and `no-dtls` is deprecated.)
no-tls

# --- authentication -----------------------------------------------------------

# Long-term credentials: the mechanism both the browser and `check:turn` use.
# coturn would infer this from `user=` and log a warning, so it is explicit.
lt-cred-mech
realm=intellimeet.local
user=intellimeet:devpassword

# --- relay ports --------------------------------------------------------------

# The UDP range handed out as relayed addresses, narrowed from coturn's
# 49152-65535 default so a stray allocation can't hold a wide slice of this
# machine's ports. A two-peer test needs two of them.
min-port=49160
max-port=49200

# The relay address is set on the command line instead, as --external-ip in
# docker-compose.yml — that is where it belongs, because it is a property of how
# the container is networked rather than of coturn itself. For a relay behind a
# NAT, the mapping can also be given here:
# external-ip=203.0.113.5/172.17.0.2

# --- peer policy --------------------------------------------------------------

# Allow peers on loopback addresses.
#
# This looks like a detail, and it is not. coturn defaults `allow_loopback_peers`
# to false, and it takes the relay address from the interface the *client*
# connected on. A same-machine test that connects to turn:127.0.0.1 therefore
# allocates relay addresses on 127.0.0.1 and then refuses the peers that arrive
# from them: the allocation succeeds, the media never flows, and nothing in the
# browser says why. Development only — coturn logs a security warning about it at
# startup.
allow-loopback-peers

# ...but coturn refuses that line while its admin CLI is on with an empty
# password, and in this version the CLI is ON by default (`turnserver --help`:
# "Turn OFF the CLI support. By default it is always ON."). So without the line
# below the relay exits immediately with:
#
#   ERROR: CONFIG: allow_loopback_peers and empty cli password cannot be used together.
#
# Turn the CLI off rather than inventing a password for an interface nothing here
# uses. Note the spelling: coturn renamed this option to `cli=false` after 4.7.0
# (where `no-cli` is deprecated and stops working), which is one more reason the
# image tag in docker-compose.yml is pinned rather than `latest`.
no-cli

# Do not relay to broadcast addresses.
no-multicast-peers

# Deliberately *not* denying private and loopback peers with denied-peer-ip,
# which coturn's example config does for a public server. A local test has both
# peers on private addresses, so copying that block in here would break exactly
# the thing this file exists to test.

# --- logging ------------------------------------------------------------------

# `simple-log` keeps the log filename as given instead of appending a pid and a
# date, and "stdout" is what `npm run turn:logs` follows.
log-file=stdout
simple-log
