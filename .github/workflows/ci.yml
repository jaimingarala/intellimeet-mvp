name: CI

on:
  push:
    branches: [main]
  pull_request:

# The server suites boot the real app with the Mongoose models stubbed, so CI
# needs no database service — which is the point: a fresh clone can verify this
# project without Atlas, Docker or a paid account.
jobs:
  server:
    name: Server (lint + test + coverage)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run lint
      # `test:coverage` is `npm test` plus the report, and it exits non-zero
      # below a floor, so the number this job prints is enforced rather than
      # decorative.
      #
      # `pipefail` is load-bearing: without it the step's exit status is `tee`'s,
      # which is always 0, and a failing suite would report green.
      - name: Tests with coverage
        run: |
          set -o pipefail
          npm run test:coverage 2>&1 | tee "$RUNNER_TEMP/server-tests.log"
      # Runs whatever the previous step did — a red run is exactly when someone
      # wants the counts — and puts them on the run page, which is publicly
      # readable, unlike the job log.
      #
      # The check after it is the difference between "a step ran" and "the numbers
      # are on the page". Writing to `$GITHUB_STEP_SUMMARY` cannot fail loudly on
      # its own: a parser handed a log it does not understand would leave this step
      # green with nothing published, which is the failure this whole job exists to
      # prevent. So the block has to be in the file, named for this job, or the
      # step fails and says which part is missing.
      - name: Publish summary
        if: always()
        working-directory: ${{ github.workspace }}
        run: |
          node scripts/ci-summary.mjs server "$RUNNER_TEMP/server-tests.log" >> "$GITHUB_STEP_SUMMARY"
          grep -q '^### Server' "$GITHUB_STEP_SUMMARY" || {
            echo "::error::the server summary block did not reach the run page"
            exit 1
          }

  # One Prettier config at the repository root covers both packages *and* the
  # root scripts, so there is a single source of truth for style instead of two
  # that can disagree.
  format:
    name: Format (prettier)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run format:check

  # The STUN codec behind `npm run check:turn` is checked against the published
  # test vectors in RFC 5769. Neither the script nor its test has any
  # dependencies, so this job needs no install step at all — which is also why
  # `scripts/ci-summary.mjs` has to parse the output rather than measure it.
  scripts:
    name: Scripts (STUN test vectors)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Tests
        run: |
          set -o pipefail
          npm run test:scripts 2>&1 | tee "$RUNNER_TEMP/scripts-tests.log"
      - name: Publish summary
        if: always()
        run: |
          node scripts/ci-summary.mjs scripts "$RUNNER_TEMP/scripts-tests.log" >> "$GITHUB_STEP_SUMMARY"
          grep -q '^### Scripts' "$GITHUB_STEP_SUMMARY" || {
            echo "::error::the scripts summary block did not reach the run page"
            exit 1
          }

  client:
    name: Client (lint + test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run lint
      # Vitest, scoped to `src/lib` — the client's WebRTC helpers and the caps it
      # mirrors from the server. `environment: node`, no browser needed.
      - name: Tests with coverage
        run: |
          set -o pipefail
          npm run test:coverage 2>&1 | tee "$RUNNER_TEMP/client-tests.log"
      - name: Publish summary
        if: always()
        working-directory: ${{ github.workspace }}
        run: |
          node scripts/ci-summary.mjs client "$RUNNER_TEMP/client-tests.log" >> "$GITHUB_STEP_SUMMARY"
          grep -q '^### Client' "$GITHUB_STEP_SUMMARY" || {
            echo "::error::the client summary block did not reach the run page"
            exit 1
          }
      - run: npm run build
